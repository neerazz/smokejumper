<svg xmlns="http://www.w3.org/2000/svg" width="2648" height="1062" viewBox="0 0 2648 1062" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">S2 — Bad deploy or config change → error spike → rollback</title>
  <desc id="d">The most common cause in public postmortems and the fastest to fix when a discrete change exists. Timelines: Cloudflare 2019 (detect→mitigate 22 min, mitigate→recover 2 min), GitHub Aug-2024 (36 min), incident.io Jul-2024 (rollback re-deployed by pipeline).</desc>
