  <text x="74" y="944" font-size="11" fill="#2f1e5c">Why it matters to Smokejumper: change-correlator is the highest-yield question in the public record (config + deploy ≈ 65 of ~200 danluu postmortems); the verifier must check the fleet version AFTER rollback, not the rollback command&#x27;s exit code.</text>
