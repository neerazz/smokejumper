  <text x="74" y="736" font-size="11" fill="#2f1e5c">Credential count for the minimum path (Slack + Alertmanager + Grafana): 4 — xapp, xoxb, Grafana service-account token, and the Alertmanager peer CIDR (not a secret). Datadog adds one webhook token; Linear MCP adds one API key or OAuth.</text>
  <text x="74" y="752" font-size="11" fill="#2f1e5c">Three proofs on the way, each a command with a checkable output: /healthz 200 · check-config exit 0 · fixtures replay → GET /runs/{fp}. Nothing here is ‘it should work’.</text>
  <text x="74" y="768" font-size="11" fill="#2f1e5c">Facts behind the counts: Slack Socket Mode quickstart (docs.slack.dev), mcp-grafana README, kubernetes-mcp-server README — see docs/plans/2026-08-29-reference-architecture-analysis.md §5.</text>
