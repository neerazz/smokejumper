  <text x="719.0" y="393.0" font-size="10.5" fill="#3d4852">scopes: app_mentions:read chat:write</text>
  <text x="719.0" y="407.0" font-size="10.5" fill="#3d4852">channels:history reactions:write</text>
  <text x="719.0" y="421.0" font-size="10.5" fill="#3d4852">Socket Mode + Interactivity ON</text>
  <rect x="945.0" y="360.0" width="222" height="96" rx="7" fill="#f1f3f5" stroke="#5b6b7a"/>
  <text x="955.0" y="378.0" font-size="11.5" fill="#3d4852" font-weight="700">two tokens → .env</text>
  <rect x="1113.2" y="439.0" width="47.800000000000004" height="13" rx="6" fill="#ffffff" stroke="#5b6b7a" stroke-width="0.8"/>
  <text x="1137.1" y="448.5" font-size="8.5" fill="#5b6b7a" font-weight="700" text-anchor="middle">2 creds</text>
  <text x="955.0" y="393.0" font-size="10.5" fill="#3d4852">xapp-… app token (connections:write)</text>
  <text x="955.0" y="407.0" font-size="10.5" fill="#3d4852">xoxb-… bot token after install</text>
  <text x="955.0" y="421.0" font-size="10.5" fill="#3d4852">no public URL · no ngrok</text>
  <rect x="945.0" y="162.0" width="222" height="68" rx="7" fill="#fff4e6" stroke="#d9480f"/>
  <text x="955.0" y="180.0" font-size="11.5" fill="#6b2a00" font-weight="700">invite bot to #incidents</text>
  <text x="955.0" y="195.0" font-size="10.5" fill="#6b2a00">/invite @smokejumper</text>
  <text x="955.0" y="209.0" font-size="10.5" fill="#6b2a00">SLACK_CHANNEL_ID → .env</text>
  <rect x="1181.0" y="480.0" width="222" height="96" rx="7" fill="#fff0f0" stroke="#c92a2a"/>
  <text x="1191.0" y="498.0" font-size="11.5" fill="#5c0d0d" font-weight="700">point the alert source at us</text>
