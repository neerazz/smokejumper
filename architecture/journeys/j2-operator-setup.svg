  <text x="483.0" y="287.0" font-size="10.5" fill="#0b3a42">postgres ok · schema head · redis ok</text>
  <text x="483.0" y="301.0" font-size="10.5" fill="#0b3a42">worker ok · outbox ok</text>
  <rect x="473.0" y="162.0" width="222" height="68" rx="7" fill="#fff4e6" stroke="#d9480f"/>
