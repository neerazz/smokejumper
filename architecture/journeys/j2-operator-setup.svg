  <text x="1370.4" y="568.5" font-size="8.5" fill="#c92a2a" font-weight="700" text-anchor="middle">1 secret</text>
  <text x="1191.0" y="513.0" font-size="10.5" fill="#5c0d0d">Alertmanager receiver → /webhooks/alertmanager</text>
  <text x="1191.0" y="527.0" font-size="10.5" fill="#5c0d0d">  peer CIDR allowlist (no credential)</text>
  <text x="1191.0" y="541.0" font-size="10.5" fill="#5c0d0d">Datadog: webhook + X-Smokejumper-Token</text>
  <rect x="1181.0" y="600.0" width="222" height="96" rx="7" fill="#f1f3f5" stroke="#5b6b7a"/>
  <text x="1191.0" y="618.0" font-size="11.5" fill="#3d4852" font-weight="700">witness credentials</text>
  <rect x="1338.4" y="679.0" width="58.6" height="13" rx="6" fill="#ffffff" stroke="#5b6b7a" stroke-width="0.8"/>
  <text x="1367.7" y="688.5" font-size="8.5" fill="#5b6b7a" font-weight="700" text-anchor="middle">1–2 creds</text>
  <text x="1191.0" y="633.0" font-size="10.5" fill="#3d4852">GRAFANA_SERVICE_ACCOUNT_TOKEN</text>
  <text x="1191.0" y="647.0" font-size="10.5" fill="#3d4852">(optional) Datadog api/app keys</text>
  <text x="1191.0" y="661.0" font-size="10.5" fill="#3d4852">k8s-mcp --read-only via kubeconfig</text>
  <rect x="1417.0" y="254.0" width="222" height="82" rx="7" fill="#e3f3f6" stroke="#0b7285"/>
  <text x="1427.0" y="272.0" font-size="11.5" fill="#0b3a42" font-weight="700">compose up --profile witness</text>
  <text x="1427.0" y="287.0" font-size="10.5" fill="#0b3a42">mcp-grafana sidecar · k8s-mcp sidecar</text>
  <text x="1427.0" y="301.0" font-size="10.5" fill="#0b3a42">manifest.yaml: every tool tiered</text>
  <text x="1427.0" y="315.0" font-size="10.5" fill="#0b3a42">boot fails on untiered tool</text>
  <rect x="1653.0" y="254.0" width="222" height="82" rx="7" fill="#e3f3f6" stroke="#0b7285"/>
  <text x="1663.0" y="272.0" font-size="11.5" fill="#0b3a42" font-weight="700">fixtures replay --source alertmanager</text>
  <rect x="1832.0" y="319.0" width="37.0" height="13" rx="6" fill="#ffffff" stroke="#0b7285" stroke-width="0.8"/>
  <text x="1850.5" y="328.5" font-size="8.5" fill="#0b7285" font-weight="700" text-anchor="middle">proof</text>
  <text x="1663.0" y="287.0" font-size="10.5" fill="#0b3a42">202 · one run · one fixture ticket</text>
  <text x="1663.0" y="301.0" font-size="10.5" fill="#0b3a42">GET /runs/{fp} → B6 + audit range</text>
  <rect x="1653.0" y="374.0" width="222" height="68" rx="7" fill="#f1f3f5" stroke="#5b6b7a"/>
  <text x="1663.0" y="392.0" font-size="11.5" fill="#3d4852" font-weight="700">first thread appears</text>
  <text x="1663.0" y="407.0" font-size="10.5" fill="#3d4852">root card + triage lines</text>
  <text x="1663.0" y="421.0" font-size="10.5" fill="#3d4852">reply with citations</text>
  <rect x="1653.0" y="162.0" width="222" height="68" rx="7" fill="#fff4e6" stroke="#d9480f"/>
  <text x="1663.0" y="180.0" font-size="11.5" fill="#6b2a00" font-weight="700">operator reads the thread</text>
  <text x="1663.0" y="195.0" font-size="10.5" fill="#6b2a00">@smokejumper what did you rule out?</text>
  <text x="1663.0" y="209.0" font-size="10.5" fill="#6b2a00">→ hypothesis board reply</text>
