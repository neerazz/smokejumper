name: ci

# The five gates SPEC 12 names, in the order a developer runs them, plus the
# stack-backed tests that skip locally. Nothing here is a CI-only code path:
# the integration job brings up the same `docker compose` stack a developer
# does, because a second way to reach Postgres would be a second thing that
# can be wrong.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs before any install, which is the point of a preflight.
      - name: Host port preflight
        run: python3 scripts/check_host_ports.py

      - name: Documentation contract
        run: python3 scripts/check_doc_contract.py

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --frozen fails rather than re-resolving, so CI can only ever test what
      # uv.lock says a developer would get.
      - name: Install
        run: uv sync --frozen --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run pyright

      - name: Tests
        run: uv run pytest

  stack:
    # Separate job so a lint failure does not wait on containers, and so the
    # integration result is legible on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --all-groups

      - name: Boot the default stack
        run: docker compose up -d --build --wait

      # SMOKEJUMPER_TEST_STACK=1 turns the integration skips into hard
      # requirements. Without it these tests would pass by not running, which is
      # the failure mode tests/conftest.py exists to prevent.
      - name: Stack-backed tests
        env:
          SMOKEJUMPER_TEST_STACK: "1"
        run: uv run pytest -m integration

      - name: Configuration validates inside the container
        run: docker compose exec -T app smokejumper check-config

      - name: Diagnostics on failure
        if: failure()
        run: docker compose ps && docker compose logs --no-color

      # Teardown keeps `-v` because this project name is disposable, which is
      # the only context SPEC 12 permits it in.
      - name: Tear down
        if: always()
        run: docker compose down -v
