[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is absent on purpose: migrations/env.py reads
# SMOKEJUMPER__DATABASE__URL so the app and its migrations can never disagree
# about which database they are talking to.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
